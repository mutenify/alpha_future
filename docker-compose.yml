services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartcredit}
      POSTGRES_USER: ${POSTGRES_USER:-smartcredit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartcredit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-mock:
    build:
      context: ./ml
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=${DB_DSN:-postgres://smartcredit:smartcredit@postgres:5432/smartcredit?sslmode=disable}
      - up
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      DB_DSN: ${DB_DSN:-postgres://smartcredit:smartcredit@postgres:5432/smartcredit?sslmode=disable}
      DATABASE_URL: ${DB_DSN:-postgres://smartcredit:smartcredit@postgres:5432/smartcredit?sslmode=disable}
      DEMO_AUTH: ${DEMO_AUTH:-true}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-mock:8081}
      MOCK_URL: ${ML_SERVICE_URL:-http://ml-mock:8081}
      JWT_SECRET: ${JWT_SECRET:-demo-only-change-me}
      HTTP_ADDR: :8080
      MOCK_TIMEOUT: ${MOCK_TIMEOUT:-3s}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      STORAGE_DIR: /data/documents
    volumes:
      - documents:/data/documents
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/v1/ready"]
      interval: 5s
      timeout: 3s
      retries: 15
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ml-mock:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: ml/Dockerfile.test
    environment:
      E2E_BASE_URL: http://backend:8080/api/v1
    volumes:
      - .:/work
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  documents:
