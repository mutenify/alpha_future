services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartcredit
      POSTGRES_USER: smartcredit
      POSTGRES_PASSWORD: smartcredit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcredit -d smartcredit"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-mock:
    build:
      context: ./ml
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_DSN: ${DB_DSN:-postgres://smartcredit:smartcredit@postgres:5432/smartcredit?sslmode=disable}
      DATABASE_URL: ${DB_DSN:-postgres://smartcredit:smartcredit@postgres:5432/smartcredit?sslmode=disable}
      DEMO_AUTH: ${DEMO_AUTH:-true}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-mock:8081}
      MOCK_URL: ${ML_SERVICE_URL:-http://ml-mock:8081}
      JWT_SECRET: ${JWT_SECRET:-demo-only-change-me}
      HTTP_ADDR: :8080
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ml-mock:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
